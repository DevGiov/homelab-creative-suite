min_log_level = verbose
system_tray = false
capture = x11
encoder = nvenc
# The web UI (PIN pairing, apps) is opened by IP or name, not localhost. Sunshine only trusts
# localhost origins by default and answers every state-changing request from another origin with
# "CSRF Protection Error" / "Missing CSRF token". Comma-separated, https:// prefix, port optional.
# This file is a template: deploy/install.sh fills the origins from the site settings (deploy/siteconf.py).
csrf_allowed_origins = @CSRF_ALLOWED_ORIGINS@
