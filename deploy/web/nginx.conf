# The browser (WASM) suite: <app>.<WEB_DOMAIN> serves /var/www/apps/<app>, behind a reverse proxy.
# This file is a template: deploy/web/install.sh fills the domain from the site settings (deploy/siteconf.py).
# One origin per app, because the apps keep state under the same localStorage and OPFS names.
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    server_name ~^(?<site>[a-z]+)\.@WEB_DOMAIN_REGEX@$;
    root /var/www/apps/$site;
    index index.html;
    server_tokens off;

    # .gz files are made once by install.sh, so a 100 MB wasm costs no CPU per request.
    gzip on;
    gzip_static on;
    gzip_proxied any;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ /\. {
        return 404;
    }

    # Names with a build hash never change; everything else must be revalidated.
    location ~ "-[0-9a-f]{8,16}(_bg)?\.(js|wasm|css)$" {
        types {
            text/javascript js;
            text/css css;
            application/wasm wasm;
        }
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.wasm$ {
        types {
            application/wasm wasm;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location ~ \.webmanifest$ {
        types {
            application/manifest+json webmanifest;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
