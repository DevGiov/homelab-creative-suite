# The container has no sound card. Apps that talk to ALSA directly (SoundCraft, FilmCraft and
# EffectCraft use cpal's ALSA host) go through the PulseAudio protocol served by PipeWire, which
# is where Sunshine captures the stream audio from.
pcm.!default {
    type pulse
    fallback "sysdefault"
}
ctl.!default {
    type pulse
}
