# Lines appended to /etc/pve/lxc/<id>.conf of the workstation container on the Proxmox host (restart it afterwards):
# expose /dev/input so the virtualhid relay can read Sunshine's virtual devices.
lxc.cgroup2.devices.allow: c 13:* rwm
lxc.mount.entry: /dev/input dev/input none bind,optional,create=dir
